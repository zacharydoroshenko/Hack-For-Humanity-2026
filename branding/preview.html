<!doctype html><meta charset="utf-8"><title>Logo options</title>
<body style="font-family:sans-serif;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;padding:16px;background:#f4f4f5">
<script>["1-shield-route","2-pin-check","3-pin-shield","4-badge-path","5-compass-star","6-wordmark"].forEach(n=>document.body.insertAdjacentHTML("beforeend",`<figure style="margin:0;background:#fff;padding:12px;border-radius:12px"><img src="${n}.svg" width="100%"><figcaption>${n}</figcaption></figure>`))</script>
